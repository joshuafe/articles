<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reminder Board</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: dark;
        font-family: "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      body {
        margin: 0;
        background: #000;
        color: #fff;
        display: flex;
        min-height: 100vh;
        justify-content: center;
        align-items: center;
      }
      main {
        text-align: center;
        max-width: 90vw;
      }
      h1 {
        font-size: clamp(3rem, 8vw, 6rem);
        margin-bottom: 2rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      li {
        font-size: clamp(2rem, 6vw, 4.5rem);
        margin-bottom: 1.8rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      li time {
        display: block;
        font-size: clamp(1rem, 2vw, 1.4rem);
        opacity: 0.6;
        margin-top: 0.6rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Reminder Board</h1>
      <ul id="reminder-list"></ul>
    </main>
    <script>
      const endpoint = new URL('/reminders', window.location.origin);
      async function fetchReminders() {
        try {
          const response = await fetch(endpoint.toString());
          if (!response.ok) {
            throw new Error(`Request failed: ${response.status}`);
          }
          const reminders = await response.json();
          renderReminders(reminders);
        } catch (error) {
          console.error(error);
        }
      }

      function renderReminders(reminders) {
        const list = document.getElementById('reminder-list');
        list.innerHTML = '';
        if (!reminders.length) {
          const empty = document.createElement('li');
          empty.textContent = 'No reminders yet';
          list.appendChild(empty);
          return;
        }
        reminders.slice().reverse().forEach((reminder) => {
          const item = document.createElement('li');
          item.textContent = reminder.text;
          const timestamp = document.createElement('time');
          const createdAt = new Date(reminder.created_at);
          timestamp.textContent = createdAt.toLocaleString([], {
            hour: '2-digit',
            minute: '2-digit',
          });
          item.appendChild(timestamp);
          list.appendChild(item);
        });
      }

      fetchReminders();
      setInterval(fetchReminders, 30000);
    </script>
  </body>
</html>
